<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lost in transit · Navya Shah</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2b1b4a; color: #fff8ec; font-family: 'Pixelify Sans', system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
      h1 { font-family: 'Press Start 2P', monospace; font-size: clamp(16px, 4vw, 28px); line-height: 1.6; text-shadow: 4px 4px 0 #ff6fae; }
      .plane { font-size: 40px; display: inline-block; animation: loop 3s steps(12) infinite; }
      @keyframes loop { from { transform: rotate(0deg) translateX(40px) rotate(0deg); } to { transform: rotate(360deg) translateX(40px) rotate(-360deg); } }
      a { display: inline-block; margin-top: 18px; padding: 12px 18px; background: #ff6fae; color: #1a1423; border: 3px solid #1a1423; box-shadow: 0 4px 0 #1a1423; font-family: 'Press Start 2P', monospace; font-size: 11px; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="plane" aria-hidden="true">✈</div>
      <h1>LOST IN TRANSIT</h1>
      <p>This gate doesn't exist. The Navya Air crew is very sorry.</p>
      <a href="/">Back to Home</a>
    </main>
    <script type="module">
      import '@fontsource/press-start-2p/400.css';
      import '@fontsource/pixelify-sans/400.css';
    </script>
  </body>
</html>
